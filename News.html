<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кнопка Подробнее</title>
  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 1rem;
    }

    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh; 
    }

    .btn {
      display: inline-block;
      background: #1e293b;
      color: white;
      font-size: 1.6rem;
      font-weight: 600;
      padding: 1.2rem 3.5rem;
      border-radius: 60px;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15), 0 4px 12px rgba(0, 0, 0, 0.05);
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      letter-spacing: 0.03em;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .btn:hover {
      background: #0f172a;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.2);
    }

    .btn:active {
      transform: scale(0.96);
      background: #0b111e;
    }

    
    .btn:focus-visible {
      outline: 3px solid #94a3b8;
      outline-offset: 3px;
    }

    
    @media (max-width: 480px) {
      .btn {
        font-size: 1.3rem;
        padding: 1rem 2.5rem;
        width: 90%;
        max-width: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="center">
    <a href="https://t.me/PinBrawl" class="btn" target="_blank" rel="noopener noreferrer">
      ПОДРОБНЕЕ
    </a>
  </div>
</body>
</html>
